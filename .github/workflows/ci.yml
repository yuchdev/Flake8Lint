name: CI

on:
  push:
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=flake8_lint --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
      - name: Run flake8-lint self-check subset
        run: python -m flake8_lint check --select X001,X009,X010 src
      - name: Build package
        run: python -m build

  wheel-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m build
      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/pip" install --upgrade pip
          "$tmpdir/venv/bin/pip" install dist/*.whl flake8
          "$tmpdir/venv/bin/flake8-lint" --version | grep '^flake8-lint 1.0.0$'

          mkdir -p \
            "$tmpdir/clean" \
            "$tmpdir/bad" \
            "$tmpdir/custom/my_project" \
            "$tmpdir/provider_pkg/provider_rules"
          cat > "$tmpdir/clean/example.py" <<'PY'
          def documented() -> int:
              """Return a number."""
              return 1
          PY
          "$tmpdir/venv/bin/flake8-lint" check "$tmpdir/clean/example.py"

          cat > "$tmpdir/bad/example.py" <<'PY'
          def handler():
              return 1
          PY
          set +e
          "$tmpdir/venv/bin/flake8-lint" check "$tmpdir/bad/example.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected lint violations exit code 1, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/bad/flake8_lint.toml" <<'TOML'
          select = ["X999"]
          TOML
          set +e
          "$tmpdir/venv/bin/flake8-lint" check --config "$tmpdir/bad/flake8_lint.toml" "$tmpdir/bad/example.py"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected invalid-config exit code 2, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/custom/my_project/__init__.py" <<'PY'
          PY
          cat > "$tmpdir/custom/my_project/lint_rules.py" <<'PY'
          import ast
          from flake8_lint import RuleContext, RuleRegistry, RuleViolation

          class NoPrintRule:
              code = "ACME001"
              description = "Do not call print() in production code."

              def check(self, context: RuleContext):
                  for node in ast.walk(context.tree):
                      if (
                          isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Name)
                          and node.func.id == "print"
                      ):
                          yield RuleViolation(
                              context.filename,
                              node.lineno,
                              node.col_offset,
                              self.code,
                              self.description,
                          )

          def register_rules(registry: RuleRegistry) -> None:
              registry.register(NoPrintRule(), provider="my_project.lint_rules")
          PY
          cat > "$tmpdir/custom/example.py" <<'PY'
          print("hello")
          PY
          set +e
          PYTHONPATH="$tmpdir/custom" "$tmpdir/venv/bin/flake8-lint" check --rule-module my_project.lint_rules --select ACME001 "$tmpdir/custom/example.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected custom-rule exit code 1, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/provider_pkg/pyproject.toml" <<'TOML'
          [build-system]
          requires = ["setuptools>=69", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "flake8-lint-provider-smoke"
          version = "0.0.0"

          [project.entry-points."flake8_lint.rules"]
          provider_smoke = "provider_rules:register_rules"
          TOML
          cat > "$tmpdir/provider_pkg/provider_rules/__init__.py" <<'PY'
          import ast
          from flake8_lint import RuleContext, RuleRegistry, RuleViolation

          class ProviderRule:
              code = "VEND001"
              description = "Do not call print() in provider smoke test."

              def check(self, context: RuleContext):
                  for node in ast.walk(context.tree):
                      if (
                          isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Name)
                          and node.func.id == "print"
                      ):
                          yield RuleViolation(
                              context.filename,
                              node.lineno,
                              node.col_offset,
                              self.code,
                              self.description,
                          )

          def register_rules(registry: RuleRegistry) -> None:
              registry.register(ProviderRule(), provider="provider_rules")
          PY
          "$tmpdir/venv/bin/pip" install "$tmpdir/provider_pkg"
          set +e
          "$tmpdir/venv/bin/flake8-lint" check --select VEND001 "$tmpdir/custom/example.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected installed-provider exit code 1, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/broad_exception.py" <<'PY'
          def handler() -> int:
              """Handle a broad exception."""
              try:
                  risky()
              except Exception:
                  return 1
          PY
          set +e
          "$tmpdir/venv/bin/python" -m flake8 --select X002 "$tmpdir/broad_exception.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected flake8 plugin exit code 1, got $status" >&2
            exit 1
          fi
